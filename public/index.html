<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style test — vinyl toon</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d1017; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .panel {
    position: fixed;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #dfe7f2;
    background: rgba(14, 18, 27, 0.62);
    border: 1px solid rgba(190, 214, 245, 0.16);
    border-radius: 9px;
    padding: 9px 12px;
    backdrop-filter: blur(9px);
    pointer-events: none;
    letter-spacing: 0.01em;
  }
  #hud { top: 12px; left: 12px; }
  #help { bottom: 12px; left: 12px; color: #b6c4d8; }
  #help b { color: #ffe9a8; font-weight: 600; }
  #loading {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; padding: 14px 20px;
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="panel" id="hud">loading…</div>
  <div class="panel" id="loading">building the scene…</div>
  <div class="panel" id="help">
    <b>WASD</b> / arrows move &nbsp;·&nbsp; <b>drag</b> orbit &nbsp;·&nbsp;
    <b>wheel</b> zoom &nbsp;·&nbsp; <b>space</b> jump &nbsp;·&nbsp; <b>J</b> attack &nbsp;·&nbsp; <b>C</b> swap character (4)
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
