<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon Vale</title>
<style>
  :root { color-scheme: dark; --ink: #dfe7f2; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d1017; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  .panel {
    position: fixed;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink);
    background: rgba(14, 18, 27, 0.62);
    border: 1px solid rgba(190, 214, 245, 0.16);
    border-radius: 9px;
    padding: 9px 12px;
    backdrop-filter: blur(9px);
    pointer-events: none;
    letter-spacing: 0.01em;
  }
  /* THE DEBUG READOUT IS OFF BY DEFAULT. fps, draws and tris are for whoever is
     tuning the game, not whoever is playing it; ` (backquote) brings it up. */
  #hud { top: 12px; left: 12px; display: none; }
  body.debug #hud { display: block; }

  /* ---- what you just got ---------------------------------------------
     A short stack of lines above the vitality bar. It exists because the
     economy was otherwise entirely invisible from inside the game: you
     killed something, the save file changed, and nothing on screen moved.
     Newest at the bottom, because that is where your eye already is. */
  #gains {
    position: fixed; left: 24px; bottom: 124px; width: 320px;
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: 3px; pointer-events: none;
    font: 600 12px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .06em;
  }
  #gains div {
    color: #ffe9a8; text-shadow: 0 1px 4px #000b, 0 0 10px #0007;
    animation: gain 2.6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  #gains div.item { color: #ffd08a; }
  #gains div.xp   { color: #a8e0ff; }
  #gains div.lvl  { color: #b6ffc0; font-size: 14px; letter-spacing: .12em; }
  @keyframes gain {
    0%   { opacity: 0; transform: translateY(8px); }
    12%  { opacity: 1; transform: none; }
    72%  { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-10px); }
  }
  /* the purse, always on -- a running total the gain lines add to */
  /* ABOVE the vitality bar, not below it: at bottom:36 this sat underneath
     the help bar and was invisible in every capture. */
  #purse {
    position: fixed; left: 24px; bottom: 30px; pointer-events: none;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .10em;
    color: #ffe9a8; text-shadow: 0 1px 4px #000b;
  }
  #purse b { font-size: 15px; }
  #purse::before { content: '◈ '; color: #ffd27a; }
  /* THE ONE LINE THAT SAYS WHAT YOU ARE DOING. Top right, under the purse,
     quiet: an objective is a reminder, not an instruction. */
  #task {
    position: absolute; right: 16px; top: 52px; max-width: 34ch;
    font: 13px/1.35 system-ui, sans-serif; color: #f3ead8; text-align: right;
    letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0,0,0,.55);
    opacity: .9; transition: opacity 240ms ease;
  }
  #task::before { content: '◆ '; color: #ffd27a; }
  #task:empty { opacity: 0; }
  body.talking #task { opacity: 0; }
  #purse .lv { display: none; }
  body.talking #gains, body.talking #purse { opacity: 0; transition: opacity 140ms ease; }
  /* WHILE A CONVERSATION IS UP, THE DEBUG FURNITURE GETS OUT OF THE WAY. The
     dialogue window is bottom-anchored and carries its own "E/Enter continue"
     footer, which landed directly on top of the help bar -- two lines of white
     text through each other. The HUD readout and the vitals bar are no better:
     a frame that is meant to read as a conversation should not also be showing
     a triangle count. `body.talking` is set by npc.js when the window opens. */
  body.talking #help, body.talking #hud, body.talking #vitals { opacity: 0;
    transition: opacity 140ms ease; }
  #help, #hud, #vitals { transition: opacity 200ms ease; }
  /* THE HELP BAR IS FURNITURE, so it sits in the far corner in the quietest
     type on the screen. Keys are drawn as keycaps: a bold letter in running
     text is a word, a boxed one is a button. */
  #help {
    bottom: 12px; right: 12px; left: auto; color: #aab6c8;
    background: rgba(14, 18, 27, 0.42); border-color: rgba(190, 214, 245, 0.10);
    font: 11px/1.7 system-ui, sans-serif; letter-spacing: .02em; padding: 6px 10px;
  }
  #help b, #talkprompt b, #useprompt b {
    display: inline-block; min-width: 1.5em; padding: 0 .35em; margin: 0 .1em;
    font: 600 10.5px/1.6 ui-monospace, Menlo, monospace; text-align: center;
    color: #ffe9a8; background: rgba(255, 233, 168, 0.10);
    border: 1px solid rgba(255, 233, 168, 0.42); border-bottom-width: 2px;
    border-radius: 4px; vertical-align: 0.05em;
  }
  #help i { font-style: normal; opacity: .45; margin: 0 .4em; }
  #help { white-space: nowrap; }
  /* a narrow window loses the two keys nobody needs in the first minute
     rather than wrapping the bar onto a second line */
  @media (max-width: 1000px) { #help .x { display: none; } }
  @media (max-width: 760px) { #help { display: none; } }
  /* THE TWO PROMPTS ARE ONE PROMPT. A person and a chest are asked for the
     same way, and the box should say so. */
  #talkprompt, #useprompt {
    font: 500 13px/1.5 system-ui, sans-serif; letter-spacing: .03em !important;
    color: #f3ead8; padding: 8px 14px; border-radius: 999px;
    background: rgba(14, 18, 27, 0.72); border-color: rgba(255, 233, 168, 0.22);
  }
  #talkprompt b, #useprompt b { font-size: 12px; margin-right: .35em; }
  #loading { top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 13px; padding: 14px 20px; }

  /* ---- the title card ---------------------------------------------------
     The world is already there behind it: the card is a dark gradient over
     the bottom of the frame, a name, and one line. It goes on the first key
     and the key still counts, so the player is walking before it has faded. */
  #title {
    position: fixed; inset: 0; pointer-events: none; z-index: 20;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 0 12vh 8vw; color: #f6efe2;
    background: linear-gradient(180deg, rgba(8,10,16,.28) 0%, rgba(8,10,16,0) 35%,
                                rgba(8,10,16,0) 55%, rgba(8,10,16,.78) 100%);
    opacity: 0; transition: opacity 900ms ease;
  }
  #title.on { opacity: 1; }
  #title.off { opacity: 0; transition: opacity 700ms ease; }
  #title .kicker { font: 500 12px/1 system-ui, sans-serif; letter-spacing: .42em;
                   text-transform: uppercase; color: #ffd27a; margin-bottom: 14px; }
  #title h1 { font: 700 clamp(40px, 7vw, 84px)/1 "Iowan Old Style", "Palatino Linotype",
              Palatino, Georgia, serif; letter-spacing: .02em; margin: 0 0 10px;
              text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 12px 40px rgba(0,0,0,.45); }
  #title h1 em { font-style: normal; color: #ffd27a; }
  #title .sub { font: 400 15px/1.5 system-ui, sans-serif; color: #d9d2c4; max-width: 46ch;
                letter-spacing: .02em; }
  #title .press { margin-top: 30px; font: 600 12px/1 system-ui, sans-serif;
                  letter-spacing: .34em; text-transform: uppercase; color: #fff6e6;
                  animation: press 2.2s ease-in-out infinite; }
  @keyframes press { 50% { opacity: .35; } }
  body.title #hud, body.title #vitals, body.title #purse, body.title #help,
  body.title #task, body.title #gains { opacity: 0; }

  /* ---- health -------------------------------------------------------- */
  #vitals {
    position: fixed; left: 24px; bottom: 56px; width: 268px;
    pointer-events: none; font: 600 11px/1 system-ui, sans-serif;
    letter-spacing: .14em; color: #cfe0f2; text-shadow: 0 1px 3px #0008;
  }
  /* WHO, AND HOW FAR ALONG. The name is the one piece of text on the screen
     set in display weight: it is the player's, and everything else is the
     game's. */
  #vitals .lab {
    margin-bottom: 7px; display: flex; align-items: baseline; gap: 10px;
    letter-spacing: .04em;
  }
  #vitals #vname { font: 700 17px/1 system-ui, sans-serif; color: #fff6e6;
                   letter-spacing: .02em; }
  #vitals #vlv { font: 700 10px/1 ui-monospace, Menlo, monospace; color: #0f1218;
                 background: #ffd27a; border-radius: 3px; padding: 3px 5px 2px;
                 letter-spacing: .08em; }
  #hpwrap {
    height: 16px; border-radius: 3px; overflow: hidden; position: relative;
    background: rgba(8, 11, 18, .78);
    border: 1px solid rgba(190, 214, 245, .28);
    box-shadow: 0 2px 10px #0007;
  }
  /* the lag bar drains behind the real one, so a big hit READS as big */
  #hplag, #hpfill { position: absolute; inset: 0 auto 0 0; height: 100%; }
  #hplag { background: #d8556a; transition: width 420ms cubic-bezier(.2,.7,.3,1) 180ms; }
  #hpfill {
    background: linear-gradient(180deg, #8fe6a8 0%, #46c07a 55%, #2f9a5f 100%);
    transition: width 90ms linear;
  }
  #hpwrap.low #hpfill { background: linear-gradient(180deg,#ffd08a,#e8853f); }
  #hpwrap.crit #hpfill { background: linear-gradient(180deg,#ff9a8a,#e04b3c); animation: pulse .7s infinite; }
  @keyframes pulse { 50% { filter: brightness(1.45); } }

  /* ---- lock-on reticle ----------------------------------------------- */
  #reticle {
    position: fixed; left: 0; top: 0; width: 46px; height: 46px;
    margin: -23px 0 0 -23px; pointer-events: none; display: none;
  }
  #reticle svg { width: 100%; height: 100%; overflow: visible;
                 animation: ret 4.2s linear infinite; }
  #reticle .r { fill: none; stroke: #ffe9a8; stroke-width: 2.4; }
  #reticle .k { fill: none; stroke: #12161f; stroke-width: 5.6; opacity: .55; }
  @keyframes ret { to { transform: rotate(360deg); } }

  /* ---- damage numbers ------------------------------------------------- */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dmg {
    position: absolute;
    font: 800 26px/1 ui-rounded, "Avenir Next", Verdana, sans-serif;
    /* A FULL OUTLINE, not a drop shadow. The number is drawn over whatever
       happens to be behind it -- a tree trunk, a pale hillside, the sky -- and
       a shadow only on one side leaves it unreadable against half of those.
       An outline all the way round reads on any background there is. */
    -webkit-text-stroke: 4px #1a1420;
    paint-order: stroke fill;
    text-shadow: 0 2px 6px #0007;
    will-change: transform, opacity;
  }

  /* ---- hurt vignette --------------------------------------------------- */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    will-change: opacity;
    background: radial-gradient(ellipse at center,
      rgba(200,40,40,0) 42%, rgba(190,30,30,.55) 100%);
  }
  /* ---- death ----------------------------------------------------------- */
  #dead {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity 600ms ease; background: rgba(6,7,11,.72);
    display: grid; place-content: center; text-align: center;
    font: 600 14px/2.4 ui-monospace, Menlo, monospace; color: #e8d8c8;
    letter-spacing: .22em;
  }
  #dead.on { opacity: 1; }
  #dead b { display: block; font-size: 30px; letter-spacing: .3em; color: #f0dcc4; }
</style>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="fx"></div>
  <div id="vignette"></div>
  <div id="dead"><b>DOWNED</b>recovering…</div>

  <div id="reticle"><svg viewBox="-24 -24 48 48">
    <g class="k">
      <path d="M-17,-9 L-17,-17 L-9,-17 M9,-17 L17,-17 L17,-9
               M17,9 L17,17 L9,17 M-9,17 L-17,17 L-17,9"/>
    </g>
    <g class="r">
      <path d="M-17,-9 L-17,-17 L-9,-17 M9,-17 L17,-17 L17,-9
               M17,9 L17,17 L9,17 M-9,17 L-17,17 L-17,9"/>
      <circle r="3.2"/>
    </g>
  </svg></div>

  <div id="vitals">
    <div class="lab"><span id="vname">—</span><span id="vlv">LV 1</span></div>
    <div id="hpwrap"><div id="hplag"></div><div id="hpfill"></div></div>
  </div>

  <div class="panel" id="hud">loading…</div>
  <div class="panel" id="loading">building the scene…</div>
  <div id="title">
    <div class="kicker">A demo</div>
    <h1>Beacon <em>Vale</em></h1>
    <div class="sub">The beacon on the north road has been dark three nights, and nobody in the square will say so out loud.</div>
    <div class="press">Press any key</div>
  </div>
  <div id="gains"></div>
  <div id="purse"></div>
  <div id="task"></div>

  <div class="panel" id="help">
    <b>WASD</b> move<i>·</i><b>J</b> attack<i>·</i><b>E</b> talk / use<i>·</i>
    <b>Q</b> lock<span class="x"><i>·</i><b>Tab</b> target</span><i>·</i><b>Space</b> jump<i>·</i>
    <b>Shift</b> slip<i>·</i><b>R</b> sheathe<span class="x"><i>·</i><b>C</b> swap</span><i>·</i><b>M</b> mute<i>·</i><b>Esc</b> menu
  </div>

  <!-- THE DIALOGUE WINDOW, vendored from the Emberbrook project unmodified.
       Classic scripts, not modules: both files are IIFEs that hang one global
       off `window` (EBUI, Dialogue), which is how they are written upstream and
       is exactly why they can be dropped in and later re-copied wholesale when
       that project improves them. They are loaded BEFORE main.js so the module
       finds them already defined -- and they are DOM-free at load time, so the
       order is the only coupling. main.js supplies the `window.UILOCK` contract
       they expect for pausing the world. -->
  <script>window.EB_SAVE_KEY = 'rpg3d-save';</script>
  <script src="/js/vendor/ui_kit.js"></script>
  <script src="/js/vendor/dialogue.js"></script>
  <!-- THE ECONOMY AND THE MENU, same provenance and the same deal. game_state
       owns the save (party, level, xp, gold, inventory, equipment); menu.js is
       the Esc screen and registers itself once GS.ready resolves; shop.js is the
       counter, opened from a keeper's dialogue rather than from a floor pad --
       this game has no pre-rendered scene keys for it to match against, and a
       shopkeeper offering to show you their stock is a better door anyway. -->
  <script src="/js/vendor/game_state.js"></script>
  <script src="/js/vendor/shop.js"></script>
  <script src="/js/vendor/menu.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
